<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 100 112" width="100" height="112" role="img" aria-label="Limit Coach">
  <title>Limit Coach</title>
  <style>
    .bob, .blink { transform-box: fill-box; transform-origin: 50% 50%; }
    @media (prefers-reduced-motion: no-preference) {
      .bob { animation: bob 3.4s ease-in-out infinite; }
      .blink { animation: blink 5.6s infinite; }
    }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6%); } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }
  </style>
  <defs><clipPath id="lc-body"><circle cx="50" cy="50" r="45"/></clipPath></defs>
  <g class="bob">
    <circle cx="50" cy="50" r="45" fill="#2474F7"/>
    <g clip-path="url(#lc-body)"><g class="blink" fill="#050505">
      <rect x="50" y="24.5" width="10" height="21" rx="5" transform="rotate(-37 55 35)"/>
      <rect x="72" y="16.5" width="7" height="19" rx="3.5" transform="rotate(-37 75.5 26)"/>
    </g></g>
  </g>
</svg>
